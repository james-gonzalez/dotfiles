# Prefix
set -g prefix C-s
set -g prefix2 C-b
bind C-s send-prefix

# Config and help
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n C-Tab select-window -t +1
bind -n C-S-Tab select-window -t -1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# Mode indicators render as coloured pills; separate #[] blocks avoid commas inside #{?}.
set -g status-right "#{?pane_in_mode,#[fg=black]#[bg=green]#[bold] COPY #[default] ,}#{?client_prefix,#[fg=black]#[bg=yellow]#[bold] PREFIX #[default] ,}#{?window_zoomed_flag,#[fg=black]#[bg=magenta]#[bold] ZOOM #[default] ,}#[fg=brightblack]%H:%M · #h "
set -g window-status-format "#[fg=white] #I:#W#{?window_zoomed_flag, 🔍,}#{?window_last_flag, ·,}#{?@claude_icon, #{@claude_icon},} "
set -g window-status-current-format "#[fg=blue,bg=brightblack,bold] ▸ #I:#W#{?window_zoomed_flag, 🔍,}#{?@claude_icon, #{@claude_icon},} "
set -g window-status-current-style "default"
set -g window-status-last-style "default"
set -g window-status-activity-style "fg=yellow"
set -g window-status-bell-style "fg=red,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g pane-border-lines heavy
# Pane titles only when a window is split; a lone pane needs no label.
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw -u pane-border-status"'
set -g pane-border-format " #{pane_index}: #{pane_current_command} · #{b:pane_current_path} "
set -g message-style "bg=blue,fg=black,bold"
set -g message-command-style "bg=blue,fg=black,bold"
set -g mode-style "bg=yellow,fg=black"
setw -g clock-mode-colour blue

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Floating popup terminal (toggleable, state preserved)
unbind f
bind f if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" -w 60% -h 60% -b rounded -s "fg=brightblack" -S "fg=blue" "tmux new-session -A -s popup"'
bind F if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" -w 95% -h 95% -B "tmux new-session -A -s popup"'

# Fuzzy window switcher (shows Claude status)
bind a display-popup -E -w 60% -h 50% \
  "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name} #{@claude_status}' | fzf --reverse | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Hide status bar inside popup session
set-hook -g session-created "if-shell -F '#{==:#{session_name},popup}' 'set status off'"
set-hook -g client-session-changed "if-shell -F '#{==:#{session_name},popup}' 'set status off'"

# OS-specific overrides (mac/ or linux/ package; optional)
source-file -q ~/.config/tmux/tmux.os.conf

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
